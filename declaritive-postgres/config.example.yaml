settings:
  max_connections: 100
  shared_preload_libraries: pg_stat_statements
hba:
  - host all app all scram-sha-256
initdb:
  postgres_user: ${POSTGRES_USER}
  postgres_password: ${POSTGRES_PASSWORD}
  postgres_db: postgres
roles:
  - name: app
    password: ${APP_PASSWORD}
databases:
  - name: radkit
    owner: app
    schemas:
      - staging
    extensions:
      - pgcrypto
      - pg_stat_statements
